<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Polonia"><title>Viaje a Polonia</title><style>:root{--bg:#07111f;--card:#0e1b2d;--card2:#13243a;--ink:#f5f7fb;--mut:#8fa0b7;--line:#20344d;--a:#ff5a5f;--y:#ffcc66;--shadow:0 10px 28px #0004}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"SF Pro Display",sans-serif;min-height:100vh}main{max-width:560px;margin:auto;padding:max(34px,calc(env(safe-area-inset-top) + 22px)) 14px calc(42px + env(safe-area-inset-bottom))}.hero{margin:0 2px 18px}.eye{font-size:.68rem;letter-spacing:.18em;font-weight:800;color:var(--a)}h1{font-size:2.1rem;line-height:1;margin:4px 0;letter-spacing:-.05em}.hero p{margin:7px 0;color:var(--mut);font-size:.88rem}.route{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:.72rem;font-weight:800;letter-spacing:.08em;color:var(--y)}.route i{width:24px;height:1px;background:var(--line)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);position:sticky;top:max(10px,env(safe-area-inset-top));z-index:5}.tabs button,.days button,.q,.btn,.spk{font:inherit;cursor:pointer}.tabs button{min-height:44px;border:0;background:transparent;color:var(--mut);border-radius:11px;font-size:.8rem;font-weight:750}.tabs button.on{background:var(--a);color:white}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:13px;box-shadow:var(--shadow)}h2{font-size:1rem;margin:0 0 10px}.hide{display:none}.days{display:flex;gap:7px;overflow:auto;margin:0 -14px 13px;padding:0 14px 3px;scrollbar-width:none}.days button{flex:0 0 auto;min-width:54px;min-height:46px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:13px;font-size:.8rem;font-weight:750}.days button.on{background:var(--y);color:#15191f;border-color:var(--y)}.row{display:flex;gap:8px;align-items:center}.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.item small,.hint{display:block;color:var(--mut);font-size:.82rem}.chk{display:flex;gap:10px;align-items:flex-start;flex:1}.chk input{width:21px;height:21px;margin:1px 0;accent-color:var(--a)}a.map{align-self:center;padding:8px 11px;border:1px solid var(--line);border-radius:999px;color:var(--y);background:var(--card2);text-decoration:none;font-weight:750;font-size:.77rem}input{width:100%;padding:12px;font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:11px;outline:none}label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 5px;font-weight:650}.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.q{padding:11px 4px;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:11px}.q b{display:block}.q span{color:var(--mut);font-size:.8rem}.cat{margin:14px 0 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card2)}.cath{padding:11px 12px;font-weight:800;border-left:4px solid var(--a)}.ph b{display:block}.ph em{font-style:normal;color:var(--y);font-weight:700}.ph span{display:block;color:var(--mut);font-size:.85rem}.spk{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;width:44px;height:44px;flex:0 0 auto}.edit{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:11px;padding:9px 12px;font-weight:700}.add{margin-top:10px}.btn{border:0;border-radius:11px;padding:12px;background:var(--a);color:#fff;font-weight:750}.del{border:0;background:none;color:#ff7a7e;font-size:1rem;padding:5px}.done{text-decoration:line-through;opacity:.55}@media(prefers-color-scheme:light){:root{--bg:#eef2f7;--card:#fff;--card2:#f5f7fa;--ink:#101827;--mut:#6f7d90;--line:#dce3ec;--shadow:0 8px 24px #1e2d4114}}</style></head><body><main><div class="hero"><div class="eye">VIAJE 2026</div><h1>Polonia</h1><p>Plan, cambio y frases para tenerlo todo a mano.</p><div class="route"><span>CRACOVIA</span><i></i><span>VARSOVIA</span></div></div><div class="tabs"><button data-t="plan" class="on">Plan</button><button data-t="cambio">Cambio Moneda</button><button data-t="frases">Frases</button></div><section id="plan"><div class="days" id="days"></div><div class="card"><div class="row" style="align-items:flex-start"><div id="dayhead" style="flex:1"></div><button class="edit" id="edit">✏️ Editar</button></div><div id="items"></div><div id="add" class="row add hide"><input id="new" placeholder="Nueva actividad…"><button class="btn" id="addb">Añadir</button></div><div class="hint" style="margin-top:10px">El plan y lo que marques se guardan en este dispositivo.</div></div></section><section id="cambio" class="hide"><div class="card"><h2>Cambio de moneda</h2><label>Zlotys (zł)</label><input type="number" id="zl" inputmode="decimal" placeholder="0,00"><label>Euros (€)</label><input type="number" id="eu" inputmode="decimal" placeholder="0,00"><label>Cambio (1 zł = … €)</label><input type="number" id="rate" inputmode="decimal" step="0.001" value="0.23"><div class="hint" style="margin-top:8px">Edita el cambio con el valor real del día.</div></div><div class="card"><h2>Importes rápidos</h2><div class="qgrid" id="quick"></div></div></section><section id="frases" class="hide"><div class="card"><h2>Frases en polaco</h2><div class="hint">🗣 En amarillo, cómo pronunciarlo leyendo en castellano.</div><div id="phr"></div></div></section></main><script>const DEF=[{s:'Dom',n:'Domingo · Cracovia',c:'Primer día',i:[['Free tour por Cracovia','Rynek Główny, Kraków'],['Comer en la zona central','Rynek Główny, Kraków'],['Tarde: plaza, parque Planty o colina de Wawel','Wawel Royal Castle, Kraków']]},{s:'Lun',n:'Lunes · Auschwitz-Birkenau',c:'Excursión desde Cracovia',i:[['Auschwitz I','Auschwitz-Birkenau Memorial Museum'],['Birkenau (Auschwitz II)','Auschwitz II-Birkenau']]},{s:'Mar',n:'Martes · Cracovia → Varsovia',c:'Día de tren',i:[['Tren Cracovia → Varsovia','Kraków Główny railway station'],['Paseo por el centro de Varsovia','Warsaw Old Town'],['Parque Łazienki y/o Ciudad Nueva','Łazienki Park, Warsaw'],['Calle Nowy Świat','Nowy Świat, Warszawa']]},{s:'Mié',n:'Miércoles · Varsovia',c:'Tour comunista y Praga',i:[['Tour comunista por Varsovia','Palace of Culture and Science, Warsaw'],['Barrio de Praga por nuestra cuenta','Praga, Warszawa'],['Tren Varsovia → Cracovia','Warszawa Centralna']]},{s:'Jue',n:'Jueves · Cracovia',c:'Kazimierz y Podgórze',i:[['Barrio judío de Kazimierz','Kazimierz, Kraków'],['Comer en Starka','Starka Kraków'],['Paseo hasta Podgórze','Podgórze, Kraków'],['Fábrica de Schindler','Schindler Factory Kraków']]},{s:'Vie',n:'Viernes · Cracovia',c:'Centro y Wieliczka',i:[['Mañana libre: Lonja de los Paños','Sukiennice, Kraków'],['Comer por el centro','Rynek Główny, Kraków'],['Minas de sal de Wieliczka (tarde)','Wieliczka Salt Mine']]},{s:'Sáb',n:'Sábado · Cracovia',c:'Día libre',i:[['Pendientes, tiendas o repetir lo que más os haya gustado',''],['Cena en Morskie Oko','Morskie Oko restaurante Kraków']]}];const P=[['Básicas','Hola','Cześć','chesh'],['Básicas','Buenos días / buenas tardes','Dzień dobry','yen dobri'],['Básicas','Buenas noches','Dobranoc','dobranots'],['Básicas','Adiós','Do widzenia','do videnia'],['Básicas','Gracias','Dziękuję','yenkuie'],['Básicas','Por favor / De nada','Proszę','proshe'],['Básicas','Perdón','Przepraszam','sheprasham'],['Para entenderse','No entiendo','Nie rozumiem','nie rosumiem'],['Para entenderse','¿Puede repetir, por favor?','Proszę powtórzyć','proshe poftushich'],['Para entenderse','¿Habla inglés?','Czy mówi pan/pani po angielsku?','chi muvi pan po angielsku'],['Comer y pagar','Una mesa, por favor','Stolik, proszę','stolik proshe'],['Comer y pagar','Una cerveza, por favor','Piwo, proszę','pivo proshe'],['Comer y pagar','La cuenta, por favor','Rachunek, proszę','rajunek proshe'],['Comer y pagar','¿Puedo pagar con tarjeta?','Czy mogę zapłacić kartą?','chi moge zapuachich kartom'],['Moverse','¿Dónde está…?','Gdzie jest…?','gie yest'],['Moverse','Izquierda / Derecha / Recto','W lewo / W prawo / Prosto','v levo / v pravo / prosto'],['Moverse','Estación de tren','Dworzec kolejowy','dvoshets koleiovi'],['Moverse','Un billete a Varsovia','Bilet do Warszawy','bilet do varshavi'],['Urgencias · 112','¡Ayuda!','Pomocy!','pomotsi'],['Urgencias · 112','Necesito un médico','Potrzebuję lekarza','potshebuie lekasha'],['Urgencias · 112','Farmacia','Apteka','apteka']];let st;try{st=JSON.parse(localStorage.polonia||'null')}catch(e){}if(!st)st={day:0,edit:false,done:{},days:DEF.map((d,di)=>({...d,i:d.i.map((x,k)=>({id:`${di}-${k}`,t:x[0],q:x[1]}))}))};const $=x=>document.getElementById(x),save=()=>localStorage.polonia=JSON.stringify(st),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function map(q){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}function render(){let d=st.days[st.day];$('days').innerHTML=st.days.map((x,i)=>`<button data-d="${i}" class="${i==st.day?'on':''}">${x.s}</button>`).join('');$('dayhead').innerHTML=`<h2 style="margin:0">${esc(d.n)}</h2><small class="hint">${esc(d.c)}</small>`;$('edit').textContent=st.edit?'✔ Listo':'✏️ Editar';$('add').classList.toggle('hide',!st.edit);$('items').innerHTML=d.i.map((x,k)=>st.edit?`<div class="item"><input data-k="${k}" value="${esc(x.t)}"><button class="del" data-del="${k}">🗑</button></div>`:`<div class="item"><label class="chk ${st.done[x.id]?'done':''}"><input type="checkbox" data-id="${x.id}" ${st.done[x.id]?'checked':''}><span>${esc(x.t)}</span></label>${x.q?`<a class="map" target="_blank" href="${map(x.q)}">Mapa</a>`:''}</div>`).join('')}document.querySelector('.tabs').onclick=e=>{let t=e.target.dataset.t;if(!t)return;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));['plan','cambio','frases'].forEach(x=>$(x).classList.toggle('hide',x!=t))};$('days').onclick=e=>{if(e.target.dataset.d!=null){st.day=+e.target.dataset.d;save();render()}};$('edit').onclick=()=>{st.edit=!st.edit;save();render()};$('items').onchange=e=>{if(e.target.dataset.id){st.done[e.target.dataset.id]=e.target.checked?1:0;if(!e.target.checked)delete st.done[e.target.dataset.id];save();render()}if(e.target.dataset.k!=null){st.days[st.day].i[+e.target.dataset.k].t=e.target.value.trim()||'Actividad';save()}};$('items').onclick=e=>{if(e.target.dataset.del!=null){st.days[st.day].i.splice(+e.target.dataset.del,1);save();render()}};$('addb').onclick=()=>{let v=$('new').value.trim();if(v){st.days[st.day].i.push({id:Date.now()+'',t:v,q:''});$('new').value='';save();render()}};function conv(a){let r=+$('rate').value||0;if(a=='z')$('eu').value=(+$('zl').value*r||0).toFixed(2);else $('zl').value=(+$('eu').value/r||0).toFixed(2)}$('zl').oninput=()=>conv('z');$('eu').oninput=()=>conv('e');function quick(){let r=+$('rate').value||.23;$('quick').innerHTML=[5,10,20,50,100,200].map(z=>`<button class="q" data-z="${z}"><b>${z} zł</b><span>${(z*r).toFixed(2)} €</span></button>`).join('')}$('rate').oninput=quick;$('quick').onclick=e=>{let z=e.target.closest('.q')?.dataset.z;if(z){$('zl').value=z;conv('z')}};let last='';$('phr').innerHTML=P.map(x=>{let h=x[0]!=last?`<div class="cat"><div class="cath">${esc(x[0])}</div>`:'';last=x[0];return h+`<div class="item ph"><div><b>${esc(x[1])}</b><em>🗣 ${esc(x[3])}</em><span>${esc(x[2])}</span></div><button class="spk" data-s="${esc(x[2])}">🔊</button></div>`}).join('')+'</div>';$('phr').onclick=e=>{let t=e.target.dataset.s;if(t&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pl-PL';u.rate=.85;speechSynthesis.speak(u)}};render();quick();</script></body></html>
